[project]
name = "trading-helper"
version = "0.1.0"
description = "바이낸스 주식 perp 데이 트레이딩 보조 대시보드"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "websockets>=12.0",
    "asyncpg>=0.29",
    "redis>=5.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
    "typer>=0.12",
    "rich>=13.7",
    "tenacity>=8.3",
    "pandas>=2.2",
    "numpy>=1.26",
    "yfinance>=0.2.40",
    "pandas-market-calendars>=4.4",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# 웹 서버는 선택 설치다. CLI 만 쓰는 사람에게 fastapi 를 강요하지 않는다.
#   pip install -e ".[web]"
web = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
]
# 뉴스·이벤트 엔진 (docs/17). Claude 판단 · 텔레그램 · RSS
#   pip install -e ".[news]"
news = [
    "anthropic>=1.7",
    "telethon>=1.40",
    "feedparser>=6.0",
]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[project.scripts]
th = "th.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

# 규칙·이벤트 YAML 은 코드와 함께 배포되어야 한다 (도커 빌드 시 빠지면 게이트가 죽는다)
[tool.setuptools.package-data]
th = ["sessions/*.yaml", "sessions/data/*.yaml"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
